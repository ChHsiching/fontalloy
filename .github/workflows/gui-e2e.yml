name: GUI seam-3 (Playwright)

# Wiring (ticket #37, spec #25). This job is the CI half of the GUI
# seam; the core half is ci.yml (`uv run pytest` on every branch push
# and every PR — no path filter). Together they run, on every push to
# the integration-relevant branches and every PR touching the seam's
# surfaces:
#
#   - the full component-style Playwright suite (gui/playwright.config.ts,
#     `npm run test:e2e`): every spec in gui/tests EXCEPT the journey
#     project — which includes the architecture-conformance guard
#     (gui/tests/conformance.spec.ts, seam 3: the banned-pattern scan
#     over gui/src and web). Specs that need real machine fonts skip
#     themselves when their env dir is absent.
#   - the TypeScript compile: `npm run build` is `tsc -b && vite
#     build` — the production-compile gate doubles as the tsc gate.
#
# Deliberately NOT run here: the journey project
# (playwright.journey.config.ts) needs the real dev catalog and the
# owner's serve layout (FONTALLOY_RUN_ASSETS), which do not exist on a
# hosted runner — it stays a local, one-suite-per-turn run; and the
# WebApp suite, which has its own workflow (webapp.yml).
#
# Integration-relevant branches: main, the spec branch behind the
# round's PR (spec/v1, PR #24), and fix/pick-pattern (the branch the
# round's cu/* work merges into). The PR paths cover every surface
# this seam consumes: the frontend (gui, web), the serve it drives
# (core, cli), and the workspace lock that builds them — a serve-side
# change can break the GUI seam without touching gui/.

on:
  push:
    branches: [main, "spec/*", fix/pick-pattern]
  pull_request:
    paths:
      - "gui/**"
      - "web/**"
      - "core/**"
      - "cli/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gui-e2e.yml"

defaults:
  run:
    working-directory: gui

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/package-lock.json

      # The synthesize suite (issue #16) drives a REAL `fontalloy serve`
      # subprocess — the dev/e2e stand-in for the Tauri sidecar. It needs
      # the workspace uv environment (core + cli + fontTools) for the
      # service binary and the fixture-font generator.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - run: uv sync
        working-directory: .

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # The real-font specs (countertruth ground truth, the minimal-path
      # synthesis, design real-pair, sceneparity, round11shots) need the
      # two real catalog binaries that never enter git. Stage them from
      # the manifest's pinned upstream artifacts (zip sha verified), the
      # same pair the local runs stage: JetBrainsMono Nerd Font Regular
      # + the Maple Mono NF-CN Regular face (staged under the t12 name
      # MapleMonoCN-Regular.ttf the test discovery accepts; the ground
      # truth reads the actual bytes either way).
      - name: Stage the two real catalog fonts
        id: stagefonts
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/realfonts"
          mkdir -p "$stage" "${RUNNER_TEMP}/jb" "${RUNNER_TEMP}/mm"
          curl -fsSL -o "${RUNNER_TEMP}/JetBrainsMono.zip"             "https://github.com/ryanoasis/nerd-fonts/releases/download/v3.5.1/JetBrainsMono.zip"
          curl -fsSL -o "${RUNNER_TEMP}/MapleMono-NF-CN.zip"             "https://github.com/subframe7536/maple-font/releases/download/v7.9/MapleMono-NF-CN.zip"
          echo "fab782a66f7d3019da64f6572db9fc5d3a4bcb19f9fa13e2d8a62e3693d6396e  ${RUNNER_TEMP}/JetBrainsMono.zip" | sha256sum -c -
          echo "af913b6322905348b3f50e4397fedc35b3a880db5effcce7969003051dcd3e94  ${RUNNER_TEMP}/MapleMono-NF-CN.zip" | sha256sum -c -
          .venv/bin/python -m zipfile -e "${RUNNER_TEMP}/JetBrainsMono.zip" "${RUNNER_TEMP}/jb"
          .venv/bin/python -m zipfile -e "${RUNNER_TEMP}/MapleMono-NF-CN.zip" "${RUNNER_TEMP}/mm"
          find "${RUNNER_TEMP}/jb" -name 'JetBrainsMonoNerdFont-Regular.ttf' -exec cp {} "$stage/" \;
          find "${RUNNER_TEMP}/mm" -name 'MapleMono-NF-CN-Regular.ttf' -exec cp {} "$stage/MapleMonoCN-Regular.ttf" \;
          ls -la "$stage"
          echo "FONTALLOY_DEV_FONT_DIR=${stage}" >> "$GITHUB_ENV"
          echo "dir=$stage" >> "$GITHUB_OUTPUT"

      # Production-compile gate before the suite drives the dev server.
      - run: npm run build

      - run: npm run test:e2e
        env:
          FONTALLOY_SERVE_BIN: ${{ github.workspace }}/.venv/bin/fontalloy
          FONTALLOY_PYTHON: ${{ github.workspace }}/.venv/bin/python
          # Explicit step-output wiring (a plain GITHUB_ENV write was not
          # reaching the suite's workers on some runs — run 39253005421
          # saw the var unset while the staging step itself succeeded).
          FONTALLOY_DEV_FONT_DIR: ${{ steps.stagefonts.outputs.dir }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: gui/test-results/
          retention-days: 7
