name: CI

# The core half of the CI wiring (ticket #37, spec #25): `uv run
# pytest` — the core suite incl. the serve contract tests — on every
# branch push and every PR, no path filter. The GUI seam half (the
# Playwright suite with the conformance guard, plus the tsc build
# gate) is gui-e2e.yml.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install the workspace
        run: uv sync --locked

      - name: Run the test suite
        run: uv run pytest -v
