name: WebApp (static build + seam-3)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "gui/src/**"
      - ".github/workflows/webapp.yml"
  pull_request:
    paths:
      - "web/**"
      - "gui/src/**"
      - ".github/workflows/webapp.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: web

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # The suite's webServer builds first; an explicit build keeps the
      # production-compile failure message readable on its own.
      - run: npm run build

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        name: playwright-report
        with:
          name: playwright-report-web
          path: web/test-results/
          retention-days: 7

  deploy:
    # GitHub Pages deploy of the pure static build (web/README.md).
    # One-time manual prerequisite: Settings -> Pages -> Build and
    # deployment -> Source = "GitHub Actions".
    needs: e2e
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
