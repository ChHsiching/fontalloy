# The capability layer: a pure-Python fontTools pipeline with no UI.
# Every consumer (cli, gui sidecar, serve) calls this package in-process.
[project]
name = "fontalloy-core"
version = "0.1.0"
description = "FontAlloy core: the fontTools merge pipeline (the only capability layer)"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "fonttools[woff]>=4.47",
    "pyyaml>=6.0",
    # woff2 output (and decode) rides brotli. Its compressed bytes are
    # reproducible within one brotli major version only, so the range
    # stays bounded and uv.lock pins the exact build — that pin is what
    # makes woff2 output byte-stable across environments.
    "brotli>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fontalloy_core"]
