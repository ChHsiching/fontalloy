# The capability layer: a pure-Python fontTools pipeline with no UI.
# Every consumer (cli, gui sidecar, serve) calls this package in-process.
[project]
name = "fontalloy-core"
version = "0.1.0"
description = "FontAlloy core: the fontTools merge pipeline (the only capability layer)"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
    "fonttools>=4.47",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fontalloy_core"]
