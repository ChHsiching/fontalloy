[package]
name = "fontalloy-gui"
version = "0.1.0"
description = "FontAlloy desktop GUI (Tauri 2 shell around the shared frontend)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "fontalloy_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
